<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaProteina Evolution Viewer</title>
    <link rel="stylesheet" href="css/styles.css">
    <!-- 3Dmol.js Viewer -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/3Dmol/2.1.0/3Dmol-min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>LaProteina Evolution Viewer</h1>
            <div class="controls">
                <select id="runSelector">
                    <option value="">Select Evolution Run...</option>
                </select>
                <button id="loadRunBtn" class="btn-primary">📂 Load Evolution Run</button>
            </div>
        </header>
        
        <div class="main-content">
            <div class="sidebar">
                <div class="sidebar-section">
                    <h2>🔄 Rounds</h2>
                    <div id="roundsList"></div>
                    <button id="createAnimationBtn" class="btn-success" style="display: none; margin-top: 0.5rem; width: 100%;">🎞️ Create Round Animation</button>
                </div>
                
                <div class="sidebar-section">
                    <h2>🧬 Designs</h2>
                    <div class="design-search-container">
                        <input type="text" id="designSearch" placeholder="🔍 Search designs in round...">
                    </div>
                    <div id="designsList"></div>
                    <div style="margin-top: 1rem;">
                        <select id="seedSelector" style="display: none; width: 100%; padding: 0.5rem; margin-bottom: 0.5rem; border-radius: 4px; border: 1px solid #ddd;">
                            <option value="">Select seed for animation...</option>
                        </select>
                        <button id="createSeedAnimationBtn" class="btn-primary" style="display: none; width: 100%;">🌿 Create Seed Animation</button>
                    </div>
                </div>
                
                <div class="sidebar-section">
                    <h2>📊 Metrics</h2>
                    <div id="metricsDisplay"></div>
                </div>
            </div>
            
            <div class="content-area">
                <!-- Tab Navigation -->
                <div class="tab-nav">
                    <button class="tab-btn active" data-tab="viewer">🔎 3D Viewer</button>
                    <button class="tab-btn" data-tab="statistics">📊 Statistics</button>
                    <button class="tab-btn" data-tab="scoring">📑 Scoring Table</button>
                    <button class="tab-btn" data-tab="notes">📝 Run Notes</button>
                </div>
                
                <!-- Viewer Tab -->
                <div class="tab-content active" id="viewerTab">
                    <div class="viewer-container">
                        <div id="ngl-viewer"></div>
                        <div class="viewer-controls">
                            <button id="resetViewBtn" class="btn-secondary">🔄 Reset View</button>
                            <button id="toggleTargetBtn" class="btn-secondary">🎯 Toggle Target</button>
                            <button id="toggleBinderBtn" class="btn-secondary">🧬 Toggle Binder</button>
                            <button id="highlightBinderBtn" class="btn-secondary">✨ Highlight Binder</button>
                            <button id="copyTargetSeqBtn" class="btn-secondary">📋 Copy Target Seq</button>
                            <button id="copyBinderSeqBtn" class="btn-secondary">📋 Copy Binder Seq</button>
                    <select id="pdbVersionSelect" style="display: none;">
                        <option value="af2">AF2 Prediction</option>
                        <option value="relaxed">Relaxed</option>
                        <option value="laproteina">LaProteina Prediction</option>
                    </select>
                    <select id="representationSelect">
                                <option value="cartoon">Cartoon</option>
                                <option value="surface">Surface</option>
                                <option value="stick">Stick</option>
                                <option value="sphere">Sphere</option>
                            </select>
                        </div>
                    </div>
                </div>
                
                <!-- Statistics Tab -->
                <div class="tab-content" id="statisticsTab">
                    <div class="stats-view">
                        <div class="stats-header-controls">
                            <h2>Round Statistics</h2>
                            <div class="round-navigation">
                                <button id="prevRoundBtn" class="nav-btn btn-primary">⬅️ Previous</button>
                                <span id="currentRoundLabel">Round 0</span>
                                <button id="nextRoundBtn" class="nav-btn btn-primary">Next ➡️</button>
                            </div>
                        </div>
                        <div id="roundStats"></div>
                    </div>
                </div>
                
                <!-- Scoring Table Tab -->
                <div class="tab-content" id="scoringTab">
                    <div class="scoring-table-view">
                        <div class="scoring-table-header">
                            <h2>Scoring Table</h2>
                            <div class="scoring-table-controls">
                                <select id="scoringRoundFilter">
                                    <option value="all">All Rounds</option>
                                </select>
                                <button id="refreshScoringTableBtn" class="btn-primary">🔁 Refresh Table</button>
                            </div>
                        </div>
                        <div id="scoringTableContainer">
                            <div style="padding: 2rem; text-align: center; color: #666;">
                                Click "Refresh" or select a round to load scoring data
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Notes Tab -->
                <div class="tab-content" id="notesTab">
                    <div class="notes-view">
                        <div class="notes-header">
                            <h2>📝 Run Notes & Description</h2>
                            <button id="saveNotesBtn" class="btn-success">💾 Save Notes</button>
                        </div>
                        <div class="notes-container">
                            <textarea id="runNotesTextarea" placeholder="Write your notes, observations, or a description for this evolution run here..."></textarea>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="animation-panel" id="animationPanel" style="display: none;">
            <h2>Animation Controls</h2>
            <div class="animation-controls">
                <button id="playBtn" class="btn-success">▶️ Play</button>
                <button id="pauseBtn" class="btn-primary">⏸️ Pause</button>
                <button id="stopBtn" class="btn-danger">⏹️ Stop</button>
                <input type="range" id="speedSlider" min="0.5" max="3" step="0.1" value="1">
                <span id="speedLabel">Speed: 1x</span>
            </div>
            <div style="margin-top: 1rem;">
                <input type="range" id="frameSlider" min="0" max="0" value="0" step="1" style="width: 100%;">
                <div style="display: flex; justify-content: space-between; margin-top: 0.25rem; font-size: 0.85rem; color: #666;">
                    <span id="frameSliderMin">0</span>
                    <span id="frameSliderMax">0</span>
                </div>
            </div>
            <div id="frameIndicator" style="margin-top: 0.5rem; text-align: center; color: #555;">Frame 0 / 0</div>
        </div>
    </div>
    
    <!-- Toast container -->
    <div id="toastContainer" class="toast-container"></div>
    
        <script src="js/viewer.js"></script>
        <script src="js/animation.js"></script>
        <script src="js/metrics.js"></script>
        <script src="js/statistics.js"></script>
        <script src="js/fileParser.js"></script>
        <script src="js/ui.js"></script>
</body>
</html>
