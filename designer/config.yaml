cluster:
  nfs_local_prefix: /Users/maximilianmatscher/remote/nfs
  nfs_cluster_prefix: /nfs
  ssh_host: null  # filled in Phase 3 (e.g. "cluster.youruni.de")
  ssh_user: matscher

checkpoints:
  laproteina: /nfs/students/matscher/laproteina_checkpoints/LD4_motif_idx_aa.ckpt
  autoencoder: /nfs/students/matscher/laproteina_checkpoints/AE3_motif.ckpt

paths:
  default_output_dir: /nfs/students/matscher/samples
  default_input_dir: /nfs/homedirs/matscher/samples

defaults:
  n_samples: 4000
  batch_size: 2
  binder_length_min: 30
  binder_length_max: 80
  n_linker_starting_points: 1
  laproteina_mode: all_atom
  inference_config: inference_motif_idx_aa
  rosetta_relax: true
  linked_input_mode: true
  direct_binder_mode: false
  folding_model: af2       # "af2" or "protenix"
  protenix_model: protenix-v2

protenix:
  # Known model versions — extend as new releases appear.
  # The first entry is used as the default.
  models:
    - protenix-v2
    - protenix_base_20250630_v1.0.0
